version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@pierre/words"
    commit-message:
      prefix: "words"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        patterns: ["*"]
        exclude-patterns: ["@pierre/words"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
